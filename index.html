<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('tetris-theme') || 'dark');
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar tema">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-form" class="name-form hidden">
          <label class="label" for="player-name">¡NUEVO RECORD! ESCRIBE TU NOMBRE</label>
          <div class="name-row">
            <input id="player-name" class="text-input" type="text" maxlength="8" autocomplete="off" spellcheck="false" placeholder="NOMBRE" />
            <button id="save-record-btn" class="btn" type="button">Guardar</button>
          </div>
        </div>

        <div id="over-records" class="records"></div>

        <button id="restart-btn" class="btn" type="button">Reiniciar</button>
        <button id="over-reset-btn" class="btn btn-danger" type="button">Resetear records</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p class="game-title">TETRIS</p>

        <div id="start-records" class="records"></div>

        <div class="start-level">
          <label class="label" for="level-select">NIVEL INICIAL</label>
          <select id="level-select" class="text-input"></select>
        </div>

        <button id="play-btn" class="btn" type="button">JUGAR</button>
        <button id="start-reset-btn" class="btn btn-danger" type="button">Resetear records</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="overlay-box">
        <!-- Vista principal del menú -->
        <div id="pause-main" class="menu-view">
          <p class="menu-title">PAUSA</p>
          <button id="resume-btn" class="btn btn-menu" type="button">Reanudar</button>
          <button id="menu-restart-btn" class="btn btn-menu" type="button">Reiniciar</button>
          <button id="show-controls-btn" class="btn btn-menu" type="button">Ver controles</button>
          <div class="menu-field">
            <label class="label" for="start-level-select">NIVEL INICIAL</label>
            <select id="start-level-select" class="menu-select"></select>
            <span class="menu-hint">Se aplica a la próxima partida</span>
          </div>
        </div>

        <!-- Sub-vista: lista de controles -->
        <div id="pause-controls" class="menu-view hidden">
          <p class="menu-title">CONTROLES</p>
          <div class="controls menu-controls">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> o <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída rápida</li>
              <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
            </ul>
          </div>
          <button id="controls-back-btn" class="btn btn-menu" type="button">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
