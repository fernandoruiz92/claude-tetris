<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('tetris-theme') || 'dark');
    document.documentElement.setAttribute('data-skin', localStorage.getItem('tetris-skin') || 'retro');
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar tema">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" title="Tema visual">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel Art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden" autocomplete="off">
          <span class="name-prompt">¡Entras en el TOP 5!</span>
          <div class="name-row">
            <input type="text" id="player-name" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button type="submit" id="save-btn">Guardar</button>
          </div>
        </form>

        <div id="records" class="records hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol id="records-list" class="records-list"></ol>
          <p id="records-empty" class="records-empty hidden">Aún no hay records</p>
          <div class="records-stats">
            <div>
              <span class="label">MEJOR COMBO</span>
              <span class="stat" id="best-combo">—</span>
            </div>
            <div>
              <span class="label">MÁX. LÍNEAS</span>
              <span class="stat" id="max-lines">0</span>
            </div>
          </div>
          <button type="button" id="reset-records-btn" class="ghost-btn">Borrar records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
